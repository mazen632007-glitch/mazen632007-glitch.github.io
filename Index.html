<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناكل ايه النهارده؟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 50px;
            font-weight: bold;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        button {
            padding: 20px 30px;
            font-size: 1.3em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
        }

        .btn-outside {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-outside:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }

        .btn-outside:active {
            transform: scale(0.95);
        }

        .btn-home {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            position: relative;
        }

        .emoji {
            font-size: 2em;
            margin-left: 10px;
        }

        .success-message {
            display: none;
            margin-top: 40px;
            font-size: 1.5em;
            color: #f5576c;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes runAway {
            0% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(100px) rotate(5deg);
            }
            100% {
                transform: translateX(-100px) rotate(-5deg);
            }
        }

        .running {
            animation: runAway 0.5s ease infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ناكل ايه النهارده؟ 🍽️</h1>
        
        <div class="options-container">
            <button class="btn-outside" onclick="selectOutside()">
                ناكل من بره 🍕
            </button>
            
            <button class="btn-home" id="homeBtn">
                ناكل في البيت 🍜
            </button>
        </div>

        <div class="success-message" id="successMsg">
            ياااه! لا كدا من بره يبقي أحسن! 😋
        </div>
    </div>

    <script>
        const homeBtn = document.getElementById('homeBtn');
        const successMsg = document.getElementById('successMsg');

        homeBtn.addEventListener('mouseover', function() {
            // تغيير الموضع بشكل عشوائي
            const randomX = (Math.random() - 0.5) * 300;
            const randomY = (Math.random() - 0.5) * 300;
            
            homeBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        });

        homeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            // إضافة تأثير الركض
            homeBtn.classList.add('running');
            
            setTimeout(() => {
                homeBtn.classList.remove('running');
            }, 500);
        });

        function selectOutside() {
            successMsg.style.display = 'block';
            successMsg.textContent = 'ياااه! من بره يبقي أحسن! 😋';
            
            // إعادة تعيين الرسالة بعد 3 ثواني
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
