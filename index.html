<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناكل ايه النهارده؟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 60px;
            font-weight: 300;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        button {
            padding: 22px 40px;
            font-size: 1.4em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
            z-index: -1;
        }

        button:hover::before {
            left: 100%;
        }

        .btn-outside {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-outside:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.5);
        }

        .btn-outside:active {
            transform: translateY(-2px);
        }

        .btn-home {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            position: relative;
        }

        .btn-home:hover {
            transform: scale(1.02);
        }

        .success-message {
            display: none;
            margin-top: 50px;
            font-size: 1.6em;
            color: #f5576c;
            animation: bounce 0.6s ease;
            font-weight: 600;
        }

        .emoji {
            display: inline-block;
            margin: 0 10px;
            font-size: 1.2em;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-25px) scale(1.1);
            }
        }

        @keyframes runAway {
            0% {
                transform: translateX(0) rotate(0deg);
            }
            25% {
                transform: translateX(150px) rotate(-10deg);
            }
            50% {
                transform: translateX(-150px) rotate(10deg);
            }
            75% {
                transform: translateX(100px) rotate(-5deg);
            }
            100% {
                transform: translateX(0) rotate(0deg);
            }
        }

        .running {
            animation: runAway 0.6s ease infinite !important;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.2em;
            }

            .container {
                padding: 40px 25px;
            }

            button {
                padding: 18px 30px;
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ ناكل ايه النهارده؟</h1>
        <p class="subtitle">اختاري واحدة من الخيارات</p>
        
        <div class="options-container">
            <button class="btn-outside" onclick="selectOutside()">
                🍕 ناكل من بره
            </button>
            
            <button class="btn-home" id="homeBtn">
                🍜 ناكل في البيت
            </button>
        </div>

        <div class="success-message" id="successMsg">
            ✨ من بره يبقي أحسن! ✨
        </div>
    </div>

    <script>
        const homeBtn = document.getElementById('homeBtn');
        const successMsg = document.getElementById('successMsg');
        let isRunning = false;

        // عند الاقتراب من الزر
        homeBtn.addEventListener('mouseover', function() {
            if (!isRunning) {
                const randomX = (Math.random() - 0.5) * 400;
                const randomY = (Math.random() - 0.5) * 300;
                
                homeBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            }
        });

        // عند محاولة الضغط
        homeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            isRunning = true;
            homeBtn.classList.add('running');
            
            setTimeout(() => {
                homeBtn.classList.remove('running');
                isRunning = false;
                homeBtn.style.transform = 'translate(0, 0)';
            }, 600);
        });

        // عند اختيار "من بره"
        function selectOutside() {
            successMsg.style.display = 'block';
            successMsg.textContent = '✨ من بره يبقي أحسن! ✨';
            
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
